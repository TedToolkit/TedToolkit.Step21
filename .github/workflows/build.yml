on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-antlr-generation:
    name: Verify ANTLR generation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate twice on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build/generate-antlr.ps1
          git diff --exit-code -- src/TedToolkit.Step21/Generated src/TedToolkit.Step21.Analyzer/Generated
          ./build/generate-antlr.ps1
          git diff --exit-code -- src/TedToolkit.Step21/Generated src/TedToolkit.Step21.Analyzer/Generated
      - name: Generate twice on Linux
        if: runner.os == 'Linux'
        shell: sh
        run: |
          ./build/generate-antlr.sh
          git diff --exit-code -- src/TedToolkit.Step21/Generated src/TedToolkit.Step21.Analyzer/Generated
          ./build/generate-antlr.sh
          git diff --exit-code -- src/TedToolkit.Step21/Generated src/TedToolkit.Step21.Analyzer/Generated
      - uses: actions/upload-artifact@v4
        with:
          name: antlr-${{ runner.os }}
          path: |
            src/TedToolkit.Step21/Generated
            src/TedToolkit.Step21.Analyzer/Generated

  compare-antlr-generation:
    name: Compare Windows and Linux ANTLR artifacts
    needs: verify-antlr-generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: antlr-Windows
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: antlr-Linux
          path: artifacts/linux
      - name: Compare generated bytes
        run: diff --recursive --brief artifacts/windows artifacts/linux

  verify-native-aot-package:
    name: Verify Native AOT package (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish and run packed consumer
        shell: pwsh
        run: ./build/verify-native-aot.ps1

  run-build-project:
    needs:
      - compare-antlr-generation
      - verify-native-aot-package
    uses: TedToolkit/TedToolkit/.github/workflows/build.yml@development
    secrets: inherit
