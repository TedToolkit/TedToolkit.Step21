on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-antlr-generation:
    name: Verify ANTLR generation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate twice on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build/generate-antlr.ps1
          git diff --exit-code -- src/TedToolkit.Step21/Generated src/TedToolkit.Step21.Analyzer/Generated
          ./build/generate-antlr.ps1
          git diff --exit-code -- src/TedToolkit.Step21/Generated src/TedToolkit.Step21.Analyzer/Generated
      - name: Generate twice on Linux
        if: runner.os == 'Linux'
        shell: sh
        run: |
          ./build/generate-antlr.sh
          git diff --exit-code -- src/TedToolkit.Step21/Generated src/TedToolkit.Step21.Analyzer/Generated
          ./build/generate-antlr.sh
          git diff --exit-code -- src/TedToolkit.Step21/Generated src/TedToolkit.Step21.Analyzer/Generated
      - uses: actions/upload-artifact@v4
        with:
          name: antlr-${{ runner.os }}
          path: |
            src/TedToolkit.Step21/Generated
            src/TedToolkit.Step21.Analyzer/Generated

  compare-antlr-generation:
    name: Compare Windows and Linux ANTLR artifacts
    needs: verify-antlr-generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: antlr-Windows
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: antlr-Linux
          path: artifacts/linux
      - name: Compare generated bytes
        run: diff --recursive --brief artifacts/windows artifacts/linux

  verify-native-aot-package:
    name: Verify Native AOT package (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish and run packed consumer
        shell: pwsh
        run: ./build/verify-native-aot.ps1

  verify-solution-build:
    name: Verify Release solution build
    needs:
      - compare-antlr-generation
      - verify-native-aot-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch and verify EXPRESS schema inputs
        shell: pwsh
        run: ./build/fetch-express-schemas.ps1 -AcknowledgeThirdPartyTerms
      # TedPipeline runs only after every verification job succeeds. AP projects remain build-only
      # because ADR-0014 still requires a separate rights review before they may be published.
      - name: Restore solution
        run: dotnet restore TedToolkit.Step21.slnx
      - name: Build solution
        run: dotnet build TedToolkit.Step21.slnx --configuration Release --no-restore --disable-build-servers
      # The hosted runner is bounded to roughly 50 minutes. Preserve the one authoritative build,
      # then let the slower test suites consume it in independent jobs.
      - uses: actions/upload-artifact@v4
        with:
          name: release-integration-build
          compression-level: 1
          retention-days: 1
          path: |
            src/**/bin/Release/**
            tests/TedToolkit.Step21.IntegrationTests/bin/Release/**

  verify-unit-tests:
    name: Verify unit tests (${{ matrix.name }})
    needs:
      - compare-antlr-generation
      - verify-native-aot-package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: classes-a
            filter: /*/*/A*/*
            minimum: 31
          - name: classes-b
            filter: /*/*/B*/*
            minimum: 56
          - name: combined-repeat
            filter: /*/*/CombinedRepeatTests/*
            minimum: 33
          - name: complex-mapping
            filter: /*/*/ComplexMappingRoundTripTests/*
            minimum: 18
          - name: other-classes-c
            filter: /*/*/(CanonicalFormatTests|CanonicalSimpleWriterTests|CapabilityTests|ChainedRedeclarationTests|CompilationTests|ConformanceManifestTests|ConstructorTests)/*
            minimum: 41
          - name: classes-d-i
            filter: /*/*/(D*|E*|F*|G*|H*|I*)/*
            minimum: 210
          - name: classes-l-q-s-z
            filter: /*/*/(L*|M*|N*|O*|P*|Q*|S*|T*|U*|V*|W*|X*|Y*|Z*)/*
            minimum: 116
          - name: classes-r
            filter: /*/*/R*/*
            minimum: 227
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch and verify EXPRESS schema inputs
        shell: pwsh
        run: ./build/fetch-express-schemas.ps1 -AcknowledgeThirdPartyTerms
      - name: Build unit test executable
        run: dotnet build tests/TedToolkit.Step21.Tests/TedToolkit.Step21.Tests.csproj --configuration Release --disable-build-servers
      - name: Run unit tests
        run: >-
          dotnet run --project tests/TedToolkit.Step21.Tests/TedToolkit.Step21.Tests.csproj
          --configuration Release --no-build --no-restore --
          --treenode-filter "${{ matrix.filter }}"
          --minimum-expected-tests ${{ matrix.minimum }}
          --progress off

  verify-integration-tests:
    name: Verify integration tests (${{ matrix.name }})
    needs: verify-solution-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: contracts-and-security
            # DownloadAndParseTests remains an explicit external-corpus opt-in; without its
            # environment flag TUnit reports the intentional skip with a failing process code.
            filter: /*/*/(CapabilityDocumentationTests|SecurityBoundaryTests|PackageCacheTests|ManifestTests)/*
            minimum: 23
          - name: ap203-package
            filter: /*/*/PackageTests/*
            minimum: 3
          - name: ap214-package
            filter: /*/*/Ap214PackageTests/(Should_bound_the_precompiled_ap214_native_static_caches|Should_match_the_initial_ap214_compatibility_manifest|Should_build_and_run_the_precompiled_ap214_package_only_consumer)
            minimum: 3
          - name: ap242-package
            filter: /*/*/Ap214PackageTests/Should_build_and_run_the_precompiled_ap242_package_and_fixture_consumer
            minimum: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch and verify EXPRESS schema inputs
        shell: pwsh
        run: ./build/fetch-express-schemas.ps1 -AcknowledgeThirdPartyTerms
      - name: Restore solution dependencies
        run: dotnet restore TedToolkit.Step21.slnx
      - uses: actions/download-artifact@v4
        with:
          name: release-integration-build
          path: .
      - name: Run integration test shard
        run: >-
          dotnet ./tests/TedToolkit.Step21.IntegrationTests/bin/Release/net10.0/TedToolkit.Step21.IntegrationTests.dll
          --treenode-filter "${{ matrix.filter }}"
          --minimum-expected-tests ${{ matrix.minimum }}
          --progress off

  verify-ci:
    name: Verify CI
    needs:
      - verify-unit-tests
      - verify-integration-tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "All build, unit, integration, ANTLR, and Native AOT checks passed."

  release:
    name: Run TedToolkit pipeline
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch and verify EXPRESS schema inputs
        shell: pwsh
        run: ./build/fetch-express-schemas.ps1 -AcknowledgeThirdPartyTerms
      - name: Run TedToolkit release pipeline
        env:
          NuGet__ApiKey: ${{ secrets.NUGET__APIKEY }}
          NuGet__Url: ${{ vars.NUGET__URL }}
          NuGet__Source: ${{ vars.NUGET__SOURCE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet run --project build/TedToolkit.Step21.Build/TedToolkit.Step21.Build.csproj --configuration Release
